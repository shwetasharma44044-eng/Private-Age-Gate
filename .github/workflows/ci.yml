name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Compact Compiler
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Update Compact Toolchain
        run: |
          compact update

      - name: Verify Compact Installation
        run: |
          compact --version

      - name: Run Contract CI
        run: npm run ci --prefix contract

      - name: Run API CI
        run: npm run ci --prefix api

      - name: Run UI CI
        run: npm run ci --prefix bboard-ui

      - name: Verify UI Build
        run: npm run build --prefix bboard-ui
